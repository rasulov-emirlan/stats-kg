services:
  statskg:
    build: .
    restart: unless-stopped
    networks: [web]
    environment:
      - AVTOSTAT_API_URL=https://avtostat.kg
      - LALAFO_API_URL=https://stats.kg
      - DATA_DIR=/data
    volumes:
      - statskg-data:/data:ro
    depends_on: [fetcher]
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.enable=true
      - "traefik.http.routers.statskg.rule=Host(`statskg.night.enkiduck.com`)"
      - traefik.http.routers.statskg.entrypoints=websecure
      - traefik.http.routers.statskg.tls.certresolver=le
      - traefik.http.services.statskg.loadbalancer.server.port=3000

  # Always-on hourly fetcher: snapshots every upstream endpoint into the shared
  # volume (see fetcher/). Same image, different command; no ports.
  fetcher:
    build: .
    command: ["node", "fetcher/run.mjs"]
    restart: unless-stopped
    networks: [web]
    environment:
      - AVTOSTAT_API_URL=https://avtostat.kg
      - LALAFO_API_URL=https://stats.kg
      - DATA_DIR=/data
    volumes:
      - statskg-data:/data
    logging: *logs
    healthcheck:
      test: ["CMD", "node", "fetcher/healthcheck.mjs"]
      interval: 10m
      timeout: 10s
      start_period: 3m
    mem_limit: 256m

volumes:
  statskg-data:

networks:
  web:
    external: true
